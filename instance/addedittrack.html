{% extends "admin_base.html" %}

{% block title %}Edit or Add track{% endblock %}

{% block content %}
<div class="mt-3">
    <h2>Add New Treck</h2>
</div>
<form method="POST">
    <div class="row mt-3">
        <div class="col-6">
            <div class="card p-3">
                <div class="mt-1">
                    <label class="form-label">Trek Name</label>
                    <input type="text" class="form-control" name="name_new" value="{{ trek.name if trek else '' }}">
                </div>
                <div class="mt-1">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" name="location_new"
                        value="{{trek.location if trek else ''}}">
                </div>
                <div class="mt-1">
                    <label class="form-label">Difficulty</label>
                    <select class="form-select" name="difficulty_new">
                        <option value="easy" {% if trek and trek.difficulty=='easy' %}selected{% endif %}>Easy</option>
                        <option value="medium" {% if trek and trek.difficulty=='medium' %}selected{% endif %}>Medium
                        </option>
                        <option value="hard" {% if trek and trek.difficulty=='hard' %}selected{% endif %}>Hard</option>
                    </select>
                </div>
                <div class="mt-1">
                    <label class="form-label">Duration(days)</label>
                    <input type="text" class="form-control" name="days_new" value="{{trek.duration if trek else ''}}">
                </div>
                <div class="mt-1">
                    <label class="form-label">Total Slots</label>
                    <input type="text" class="form-control" name="slots_new"
                        value="{{trek.totalslots if trek else ''}}">
                </div>
            </div>
        </div>
        <div class="col-6">
            <div class="card p-3">
                <div class="mt-1">
                    <label class="form-label">Start date</label>
                    <input type="date" class="form-control" placeholder="dd/mm/yyyy" name="start_date_new"
                        value="{{trek.start_date if trek else ''}}">
                </div>
                <div class="mt-1">
                    <label class="form-label">End date</label>
                    <input type="date" class="form-control" placeholder="dd/mm/yyyy" name="end_date_new"
                        value="{{trek.end_date if trek else ''}}">
                </div>
                <div class="mt-1">
                    <label class="form-label">Assign staff</label>
                    <select class="form-select" name="staffname_new">
                        <option selected disabled>-- Select --</option>
                        {% for staff in stafflist %}
                        <option value="{{staff.id}}" {% if trek and trek.assigned_staff_id==staff.id %}selected{% endif
                            %}>{{ staff.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mt-1">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status_new">
                        <option selected disabled>-- Select --</option>
                        <option value="Open" {% if trek and trek.status=='Open' %} selected {% endif %}>Open</option>
                        <option value="Closed" {% if trek and trek.status=='Closed' %} selected {% endif %}>Closed
                        </option>
                    </select>
                </div>
                <div class="mt-1">
                    <label class="form-label"> Description</label>
                    <input type="text" class="form-control" name="description_new"
                        value="{{trek.description if trek else ''}}">
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
            <div>
                <a href="/adminmanagetreks" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>
</form>
{% endblock %}
