{% extends "admin_base.html" %}

{% block title %}Bookings{% endblock %}

{% block content %}
<h1 class="mt-3">All bookings</h1>
<div class="mt-4">
    <input type="text" class="form-control" placeholder="Search bookings.." name="searchbookings">
</div>
<div class="row mt-3">
    <div class="col-12">
        <div class="card p-3">
            <table class="table">
                <thead>
                    <tr>
                        <th>Booking ID</th>
                        <th>User</th>
                        <th>Trek</th>
                        <th>Booking date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in b%}
                    <tr>
                        <td>{{i.id}}</td>
                        <td>{{i.user_id}}</td>
                        <td>{{i.trek_id}}</td>
                        <td>{{i.booking_date}}</td>
                        <td>{{i.status}}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
