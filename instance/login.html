{% extends "login_base.html" %}

{% block title %}
Login
{% endblock %}
{% block content %}
<div class="container d-flex justify-content-center mt-5">
    <div class="card login-box p-4" style="width: 400px">
        <form method="POST">
            <div class="d-flex justify-content-center mb-3">
                <h1> LOGIN </h1>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Email" name="email">
            </div>
            <div class="mt-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Password" name="password">
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </div>
            <div class="form-check mt-3">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <!-- <div class="mt-4">
                <a href="/staffdashboard" class="btn btn-primary w-40"> temp directly go to staff dashboard</a>
            </div>
            <div class="mt-4">
                <a href="/userdashboard" class="btn btn-primary w-40"> temp directly go to user dashboard</a>
            </div> -->
        </form>
        <div class="mt-3">
            <p>
                New member? <a href="/register">Register here!</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
