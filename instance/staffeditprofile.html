{% extends "staffdashboard.html" %}
{% block title %}
Edit profile
{% endblock %}
{%block content %}
<div class="card mt-3 p-3">
    <h3>Edit Profile</h3>
    <form method="POST">
        <div class="mt-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" value={{u.name}}>
        </div>
        <div class="mt-3">
            <label class="form-label">Email</label>
            <input type="text" class="form-control" name="email" value={{u.email}}>
        </div>
        <div class="mt-3">
            <label class="form-label">Contact</label>
            <input type="text" class="form-control" name="contact" value={{u.contact}}>
        </div>
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>
    </form>
</div>
{% endblock %}
