<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Trekking Management App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="bg-light p-3 border-bottom">
        <h5>Trekking Management Application</h5>
    </div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-2">
                <div class="list-group">
                    <a href="/userdashboard" class="list-group-item list-group-item-action mt-2 mb-3">
                        <h4>Dashboard</h4>
                    </a>
                    <a href="/userbrowsetreks" class="list-group-item list-group-item-action mt-2 mb-3">
                        <h4>Browse Treks</h4>
                    </a>
                    <a href="usermybookings" class="list-group-item list-group-item-action mt-2 mb-3">
                        <h4>Bookings</h4>
                    </a>
                    <a href="/usertrekkinghistory" class="list-group-item list-group-item-action mt-2 mb-3">
                        <h4>History</h4>
                    </a>
                    <a href="/usereditprofile" class="list-group-item list-group-item-action mt-2 mb-3">
                        <h4>Profile</h4>
                    </a>
                </div>
            </div>
            <div class="col-10">
                {%block content%} {% endblock %}
            </div>
        </div>
</body>

</html>
